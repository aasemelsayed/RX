# RX Launcher: refresh channels.json on the "data" branch (liveonsat.com channels per launcher match).
# Schedules only run from the default branch, so this file lives on main; it reads and writes only "data".
name: channels
on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch:
permissions:
  contents: write
concurrency: channels
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
      - name: Build channels.json
        run: python3 build_channels.py channels.json
      - name: Save (one commit, keeps the branch small)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add channels.json
          git diff --cached --quiet && exit 0
          git commit --amend -q -m "channels $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -f origin data
